# Ensayo de lo que distingue a Supabase: su imagen de PostgreSQL (roles, extensiones, pg_cron) y la API de datos
# (PostgREST), que NO debe devolver ninguna tabla de la aplicación. Solo para `make ensayo-supabase`.
services:
  db:
    image: supabase/postgres:17.6.1.084
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 3s
      timeout: 3s
      retries: 40
  api:
    image: public.ecr.aws/supabase/postgrest:v16.1
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secreto-de-ensayo-con-al-menos-32-caracteres
    ports:
      - "127.0.0.1:54330:3000"
