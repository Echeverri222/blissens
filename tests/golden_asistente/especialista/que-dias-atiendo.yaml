id: que-dias-atiendo
perfil: especialista
actor: rios
categoria: horario
pregunta: que dias y en que horario atiendo?
intencion: El horario semanal de la Dra. Ríos, de lunes a viernes, 08:00–12:00 y 13:00–17:00.
herramientas:
  esperadas: [mi_horario]
  prohibidas: [datos_del_negocio]
contexto:
  - llamada: mi_horario
    args: {}
    incluye: ["lunes", "viernes", "08:00", "12:00", "13:00", "17:00"]
    excluye: ["sábado", "domingo"]
respuesta:
  incluye: ["lunes", "viernes"]
  incluye_alguno: ["8:00", "08:00", "8 a. m.", "8 de la mañana"]
  excluye: ["sábado", "domingo"]
  propuestas: []
notas: >-
  Es su horario propio, no el del negocio: `datos_del_negocio` da el horario agregado de todos y aquí sería la respuesta
  equivocada aunque hoy coincidan.
