id: que-dias-atiendo
perfil: especialista
actor: rios
categoria: horario
pregunta: que dias y en que horario atiendo?
intencion: El horario semanal de la Dra. Ríos, de lunes a viernes, 07:30–12:00 y 13:00–17:30.
herramientas:
  esperadas: [mi_horario]
  prohibidas: [datos_del_negocio]
contexto:
  - llamada: mi_horario
    args: {}
    incluye: ["lunes", "viernes", "07:30", "12:00", "13:00", "17:30"]
    excluye: ["sábado", "domingo"]
respuesta:
  incluye: ["lunes", "viernes"]
  incluye_alguno: ["7:30", "07:30", "7 y media"]
  excluye: ["sábado", "domingo"]
  propuestas: []
notas: >-
  Es su horario propio, no el del negocio: `datos_del_negocio` da el horario agregado de todos y aquí sería la respuesta
  equivocada aunque hoy coincidan.
