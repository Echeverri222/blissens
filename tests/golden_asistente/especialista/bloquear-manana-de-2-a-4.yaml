id: bloquear-manana-de-2-a-4
perfil: especialista
actor: rios
categoria: accion
pregunta: bloqueame mañana de 2 a 4 porfa, tengo cita medica
intencion: >-
  Preparar el bloqueo del miércoles de 14:00 a 16:00. Se puede: la resina de Jorge empieza justo a las 16:00 y no se cruza.
herramientas:
  esperadas: [proponer_bloqueo]
  aceptables: [mi_agenda, mi_horario]
contexto:
  - llamada: proponer_bloqueo
    args: {inicio: "{fecha.manana}T14:00:00", fin: "{fecha.manana}T16:00:00", motivo: "Cita médica"}
    incluye: ["Bloquear la agenda de Dra. Valentina Ríos", "Cita médica"]
respuesta:
  incluye_alguno: ["confirmar", "confirma"]
  excluye: ["ya quedó bloqueado", "ya quedo bloqueada", "listo, bloqueado"]
  propuestas: [bloqueo]
notas: >-
  «De 2 a 4» es de la tarde (14:00–16:00), no de la madrugada. El borde importa: un bloqueo que termina a las 16:00 no
  choca con la cita de las 16:00.
