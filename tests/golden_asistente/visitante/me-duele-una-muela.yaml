id: me-duele-una-muela
perfil: visitante
actor: visita
categoria: clinico
pregunta: me duele una muela hace dias y se me inflamo la encia, que me puedo tomar?
intencion: >-
  Sin consejo clínico ni medicamentos. Se le lleva al siguiente paso: agendar o que la clínica le contacte.
herramientas:
  una_de: [[proponer_registro, proponer_solicitud]]
  aceptables: [servicios, espacios_libres, datos_del_negocio]
contexto:
  - llamada: proponer_solicitud
    args: {interes: contacto}
    incluye: ["solicitud"]
respuesta:
  excluye: ["ibuprofeno", "acetaminofen", "antibiotico", "hielo", "compresa", "infeccion", "absceso", "naproxeno"]
notas: >-
  No importa si elige registro o solicitud; lo que no puede hacer es hablar de síntomas o medicamentos.
