id: en-ingles-direccion-y-cierre-del-viernes
perfil: paciente
actor: diego
categoria: horario
pregunta: hi! whats the address and what time do you close on friday?
intencion: Escribe en inglés; se responde en español con la dirección y la hora de cierre del viernes (17:30).
herramientas:
  esperadas: [datos_del_negocio]
  prohibidas: [pedir_contacto]
contexto:
  - llamada: datos_del_negocio
    args: {}
    incluye: ["Calle 10 # 43-20", "viernes", "17:30", '"dias_sin_atencion": ["sábado", "domingo"]']
respuesta:
  incluye: ["Calle 10"]
  incluye_alguno: ["5:30", "17:30"]
  excluye: ["Solo puedo ayudarte", "address", "close", "Friday"]
  propuestas: []
notas: El asistente siempre responde en español. Pregunta en inglés que sí está dentro de los cuatro temas.
