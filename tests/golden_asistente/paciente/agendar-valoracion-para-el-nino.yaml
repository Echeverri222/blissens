id: agendar-valoracion-para-el-nino
perfil: paciente
actor: laura
categoria: accion
pregunta:
  - necesito sacarle cita al niño para valoracion
  - el lunes temprano se puede?
  - listo la primera q haya
  - si dale
intencion: >-
  Agendar una valoración para Tomás (no para Laura): primero las horas libres del lunes 23 de noviembre; con «la primera
  q haya» le dice la de las 8:00 y le pregunta si se la deja (sin preparar nada); con el «si dale», la propuesta de las
  8:00 con `para` = Tomás.
herramientas:
  esperadas: [espacios_libres, proponer_agendar]
  aceptables: [mis_citas, servicios]
contexto:
  - llamada: mis_citas
    args: {}
    incluye: ["Tomás"]
  - llamada: espacios_libres
    args: {servicio_id: "{servicio.valoracion}", desde: "{fecha.lunes}", dias: 1}
    incluye: ["Valoración", "lunes 23 de noviembre a las 8:00 a. m."]
  - llamada: proponer_agendar
    args: {servicio_id: "{servicio.valoracion}", inicio: "{fecha.lunes}T08:00:00-05:00", para: "{paciente.tomas}"}
    incluye: ["Tomás", "Valoración", "lunes 23 de noviembre a las 8:00 a. m."]
    excluye: ["Laura", "Gómez Arango"]
respuesta:
  incluye: ["Tomas"]
  incluye_alguno: ["8:00", "8 a. m.", "8 de la mañana"]
  propuestas: [agendar]
notas: >-
  «El niño» es Tomás: el modelo debe tomar su id de `mis_citas.hogar` y pasarlo en `para`. Si agenda para Laura, la
  propuesta sale a nombre de Laura y el caso falla en la respuesta. «La primera q haya» no es una hora exacta: el paciente
  siempre confirma la hora antes de la propuesta (una propuesta en el tercer turno sería de más).
