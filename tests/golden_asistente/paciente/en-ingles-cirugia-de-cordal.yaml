id: en-ingles-cirugia-de-cordal
perfil: paciente
actor: jorge
categoria: accion
pregunta: can i book a wisdom tooth surgery for next week?
intencion: >-
  En inglés: la cirugía no se agenda desde el enlace del paciente. No se prepara ninguna cita; se responde en español y
  se ofrece que la clínica lo contacte.
herramientas:
  esperadas: [servicios]
  aceptables: [pedir_contacto, espacios_libres]
  prohibidas: [proponer_agendar]
contexto:
  - llamada: servicios
    args: {}
    excluye: ["Cirugía"]
respuesta:
  incluye: ["clinica"]
  excluye: ["Solo puedo ayudarte", "clinic ", "surgery", "book"]
  propuestas: []
notas: >-
  Responde en español aunque escriba en inglés. No es fuera de alcance: es una cita, solo que no autoagendable. Tampoco es
  pregunta clínica, así que no corresponde «Llama a la clínica».
