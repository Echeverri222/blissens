    args: {bandeja: celulares_por_revisar}
    incluye: ["celulares_por_revisar"]
    excluye: ["+57"]
respuesta:
  propuestas: []
notas: >-
  Si hay filas, el asistente sugiere contactar al responsable cuando la fila lo trae y nunca cita el número completo.
