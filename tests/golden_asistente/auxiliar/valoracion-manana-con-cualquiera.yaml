id: valoracion-manana-con-cualquiera
perfil: auxiliar
actor: marta
categoria: agenda
pregunta: hay algo para una valoracion mañana en la mañana con el que sea?
intencion: Horas libres de valoración mañana por la mañana con cualquier profesional (desde las 8:00; la valoración dura 45 min).
herramientas:
  esperadas: [espacios_libres]
  aceptables: [servicios, agenda]
  prohibidas: [proponer_agendar]
contexto:
  - llamada: espacios_libres
    args: {servicio_id: "{servicio.valoracion}", desde: "{fecha.manana}", dias: 1}
    incluye: ["cualquiera", "{fecha.manana}T08:00", "{fecha.manana}T11:00", "profesional_id"]
respuesta:
  incluye_alguno: ["8:00", "8:00 a. m.", "8 a. m.", "8 de la mañana"]
  propuestas: []
notas: >-
  Buscando «con cualquiera», cada hora dice con quién quedaría, para que «agéndalo a las 8:00» tenga el `profesional_id`
  que pide `proponer_agendar` del equipo.
