# El paciente usa el enlace de baja de un correo: los correos siguientes quedan "omitido" y WhatsApp no se toca.
dado:
  paciente: {nombres: "Ana", apellidos: "Pérez", correo: "ana@example.com", acepta_correo: true}   # datos ficticios
  cita: {inicio: {dia: 3, hora: "10:00"}}
pasos:
  - baja_correo: true
  - avanzar: {respecto_a_cita: "-23h59m"}
  - ciclo: true
  - cancela: true
