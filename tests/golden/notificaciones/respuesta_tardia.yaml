# El paciente toca un botón del recordatorio cuando la cita ya empezó: no cambia nada y recibe "respuesta tardía".
dado:
  paciente: {nombres: "Ana", apellidos: "Pérez"}   # datos ficticios
  cita: {inicio: {dia: 3, hora: "10:00"}}
pasos:
  - avanzar: {respecto_a_cita: "-47h59m"}
  - ciclo: true
  - avanzar: {respecto_a_cita: "+5m"}
  - presiona: {mensaje: recordatorio_48h, boton: 0}
