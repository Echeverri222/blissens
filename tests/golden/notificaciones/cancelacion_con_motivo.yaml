# "No podré ir": la cita se cancela, el paciente recibe la lista de motivos, elige "Viaje" y recibe el seguimiento
# con el enlace para reagendar.
dado:
  paciente: {nombres: "Ana", apellidos: "Pérez"}   # datos ficticios
  cita: {inicio: {dia: 3, hora: "10:00"}}
pasos:
  - avanzar: {respecto_a_cita: "-47h59m"}
  - ciclo: true
  - presiona: {mensaje: recordatorio_48h, boton: 1}   # "No podré ir"
  - foto: pidiendo_motivo
  - presiona: {mensaje: pedir_motivo, boton: 2}        # tercer motivo de la lista
