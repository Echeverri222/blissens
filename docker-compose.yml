services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estudia
      POSTGRES_PASSWORD: estudia
      POSTGRES_DB: estudia
      TZ: America/Bogota
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - estudia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudia -d estudia"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  estudia_pgdata:
