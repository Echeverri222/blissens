[project]
name = "estudia"
version = "0.1.0"
description = "Estud-IA: gestión inteligente de citas (Blissens Odontología)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "faker>=30",
  "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["estudia"]
