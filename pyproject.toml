[project]
name = "estudia"
version = "0.1.0"
description = "Estud-IA: gestión inteligente de citas (Blissens Odontología)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "faker>=30",
  "tzdata",
  "anthropic>=2.14.0",
  "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
extend-exclude = ["panel", "datos_reales", "contexto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F841", "E731"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["estudia"]
